name: 南京地铁客流数据更新

# 【采集已改在本机执行，云端仅保留手动入口】
# 周更由 scripts/local-nj-metro-sync.py 承担（WorkBuddy 每周一 18:00 CST 调用），
# 与重庆、郑州、合肥三条管道统一：本机读取 Cookie、本机提交推送，凭据不出本机，
# 也不再占用 Actions 并发额度。本工作流只用于应急补跑与链路诊断，不设定时。
#
# 与重庆管道的差异：南京官方微博把分线路数值**直接写在正文里**，纯文本正则即可解析，
# 因此不需要下载配图、不需要 OCR、也不需要 pip 安装任何依赖，跑完约 1 分钟。
#
# 数据源能力边界（务必知悉）：
#   sina.cn 免登录源能返回该账号最近约 100 条微博（≈20 天），
#   回溯 14 天的周更**不配置 Cookie 也能长期跑**；本机若有 Cookie 则双源合并更全。
#   若要回填更早的历史，才需要仓库 Secret WEIBO_COOKIE
#   （微博时间线深分页会限流、搜索索引约 7 页封顶，更早的数据任何接口都取不到）。

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: '截止日期 YYYY-MM-DD（含）。留空 = 昨天'
        required: false
        type: string
      backfill_days:
        description: '回溯补录天数（需配置 WEIBO_COOKIE 才能覆盖更早的历史）'
        required: false
        default: '14'
        type: string
      source:
        description: '数据源'
        required: false
        default: 'auto'
        type: choice
        options: [auto, sina, weibo]
      dry_run:
        description: '只抓取校验、不提交（演练模式）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nj-metro-update
  cancel-in-progress: false

jobs:
  update:
    name: 抓取 → 解析 → 校验 → 提交
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.run.outputs.result }}
      added: ${{ steps.run.outputs.added }}
      start_date: ${{ steps.run.outputs.start_date }}
      end_date: ${{ steps.run.outputs.end_date }}
      total: ${{ steps.run.outputs.total }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.METRO_SYNC_TOKEN }}
          ref: master
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 执行采集
        id: run
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: |
          set -euo pipefail
          ARGS=(--source "${{ inputs.source || 'auto' }}")
          [ -n "${{ inputs.end_date || '' }}" ] && ARGS+=(--end "${{ inputs.end_date }}")
          ARGS+=(--backfill-days "${{ inputs.backfill_days || '14' }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
          echo "参数：${ARGS[*]}"
          python3 scripts/update-nj-metro-data.py "${ARGS[@]}"

      - name: 校验数据文件语法
        if: steps.run.outputs.result != 'failed'
        run: node --check docs/public/nj-metro-passenger-data.js

      - name: 提交变更
        if: steps.run.outputs.result == 'success'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/public/nj-metro-passenger-data.js
          if git diff --cached --quiet; then
            echo "无文件变更，跳过提交。"
            exit 0
          fi
          git commit -m "data: 南京地铁客流数据 ${{ steps.run.outputs.start_date }} ~ ${{ steps.run.outputs.end_date }}（新增 ${{ steps.run.outputs.added }} 天，累计 ${{ steps.run.outputs.total }} 天）"

      - name: 拉取并推送
        if: steps.run.outputs.result == 'success'
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && break
            echo "第 $i 次 rebase 失败，重试…"; sleep 5
          done
          git push origin HEAD:master

      - name: 作业摘要
        if: always()
        run: |
          {
            echo "**执行结果**：\`${{ steps.run.outputs.result || 'unknown' }}\`"
            echo "**新增天数**：${{ steps.run.outputs.added || 0 }}"
            echo "**数据区间**：\`${{ steps.run.outputs.start_date || '-' }}\` ~ \`${{ steps.run.outputs.end_date || '-' }}\`"
            echo "**库内累计**：${{ steps.run.outputs.total || '-' }} 天"
            echo ""
            echo "> 日常周更由本机 WorkBuddy 自动化（每周一 18:00 CST）执行，云端仅作应急补跑。"
            echo "> 历史数据回填需配置 Secret \`WEIBO_COOKIE\`，"
            echo "> 之后手动触发本工作流并填写 \`backfill_days\` 即可。"
          } >> "$GITHUB_STEP_SUMMARY"
